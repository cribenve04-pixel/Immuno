<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="screen-orientation" content="any" />
    <meta name="x5-orientation" content="any" />

    <meta name="description" content="Manuale Universitario di Immunologia Generale e Clinica: Fondamenti, Architettura del Sistema Immunitario, Risposta Adattativa e Immunopatologia." />
    <meta property="og:title" content="Manuale di Immunologia - Capitolo 1" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Immunologia" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
    <!-- Ripristino immediato del tema per evitare flash visivi (FOUC) alla ricarica della pagina -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('immunologia_theme') || 'light';
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'slate' || savedTheme === 'night') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-slate-200 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Script Registrazione Service Worker & Sblocco Rotazione Schermo -->
    <script>
      // Sblocca orientamento schermo all'avvio per consentire la rotazione libera su Android / PWA
      if (typeof window !== 'undefined' && window.screen && window.screen.orientation && typeof window.screen.orientation.unlock === 'function') {
        try {
          window.screen.orientation.unlock();
        } catch (e) {}
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((reg) => console.log('Service Worker registrato con successo!', reg.scope))
            .catch((err) => console.error('Errore registrazione Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
